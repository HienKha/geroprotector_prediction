schema_version: geroprotector.blend_xai_v3.protocol.v1
scientific_role: >-
  post_lock_descriptive_explainability_for_the_equal_thirds_svm_tanimoto_tabfm
  blend, run side by side with the equal_thirds_svm_tanimoto_tabpfnv2 blend so
  the two can be compared on insight quality under identical weights.

# Same analysis suite (sections A-J) as blend_xai_v2, which explained the
# 0.10/0.60/0.30 TabPFN-v2 blend.  Two changes:
#   1. both explained blends are EQUAL THIRDS, so the TabFM-vs-TabPFN comparison
#      is not confounded by the weight vector;
#   2. a new section K scores the two blends head to head on prespecified
#      insight-quality criteria.
# Every correction made in v2 is retained: three-level decomposition, libsvm
# Platt form 1/(1+exp(A*f+B)), subsample-without-replacement stability with
# non-convergence as a hard error, prevalence-adjusted applicability domain.

analysis_contract:
  locked_model_is_refit_or_reweighted: false
  threshold_is_changed: false
  test_or_external_labels_used_to_build_explanations: false
  all_results_are_post_lock_descriptive: true
  bootstrap_refits_are_training_only_diagnostics: true
  thresholds_derived_from: full_324_d1_train_cross_fitted_oof_mcc

blends:
  eqthirds_tabfm:
    components: [paper_svm, tanimoto_svc, tabfm]
    weights: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]
    slot3_family: foundation_tabular_google_research_tabfm_1.0.1
    slot3_applies_platt: false
    expected_train_oof_mcc_threshold: 0.5263794471128225
  eqthirds_tabpfnv2:
    components: [paper_svm, tanimoto_svc, tabpfn_v2]
    weights: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]
    slot3_family: foundation_tabular_prior_labs_tabpfn_v2
    slot3_applies_platt: false
    expected_train_oof_mcc_threshold: null   # derived on train OOF, no sealed value

decomposition_scale:
  component_level_raw_blend: exact_100pct_of_weight
  within_component_margin: exact_margin_space_only_two_thirds_of_weight
  final_probability: not_additively_attributable_platt_and_expit_sigmoid
  note: >-
    Under equal thirds the analytically decomposable share rises from 0.70
    (0.10 svm + 0.60 tanimoto) to 0.6667 (1/3 svm + 1/3 tanimoto) -- LOWER, not
    higher, because the Tanimoto slot lost weight.  Stated explicitly so the
    change is not mistaken for an improvement.

applicability:
  similarity: morgan_radius2_2048bit_tanimoto_to_locked_d1_train
  tanimoto_cutoffs: [0.30, 0.40, 0.50, 0.60]
  report_prevalence_adjusted_ap: true
  report_bootstrap_ci: true
  coverage_performance_curve: true

chemical_classes:
  prespecified_before_inspecting_class_results: true
  inherited_verbatim_from: blend_xai_v2
  aliphatic_hydroxyl_smarts: "[CX4][OX2H]"
  aromatic_hydroxyl_smarts: "[c][OX2H]"
  carboxylic_acid_smarts: "[CX3](=O)[OX2H1]"
  polyol_sugar_like_min_aliphatic_oh: 3
  polyphenol_like_min_aromatic_oh: 2
  role: post_hoc_error_analysis_not_candidate_discovery

stability:
  coefficient_subsamples: 200
  subsample_fraction: 0.8
  method: subsample_without_replacement
  nonconverged_refits_are_a_hard_error: true

insight_comparison:
  prespecified_criteria:
    - discrimination_ap_and_auroc_with_paired_bootstrap
    - calibration_ece_slope_brier
    - error_detection_auroc_from_component_disagreement
    - component_redundancy_pearson_and_unique_ablation_contribution
    - applicability_domain_signal_inside_minus_outside
    - chemical_class_bias_magnitude
    - analytic_attribution_coverage_of_blend_weight
  note: >-
    Criteria and their direction of preference were fixed before any v3 result
    was produced.  "Better insight" is scored on these criteria only.

bootstrap_resamples: 2000
seed: 20260821

sources:
  positive_sha256: 41cc8451d80b9aec09574842e4c7007132d68cd613436460b2a784154f609e74
  negative_sha256: 396f78e7546d76529c808abb01d02da617da92c3d4aed83551901cc3ffd09c14
  expected_rows: 405

