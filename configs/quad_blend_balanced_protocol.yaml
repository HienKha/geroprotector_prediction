schema_version: geroprotector.quad_blend_balanced.protocol.v1
scientific_role: >-
  balanced sensitivity/specificity variants of the equal-quarters four-component
  blend at a FIXED 0.5 threshold, admitted only if no headline metric degrades.

contract:
  fixed_threshold: 0.5
  any_model_is_refitted: false
  test_or_external_labels_used_for_weights_threshold_or_calibration: false
  selection_basis: 324_row_d1_train_cross_fitted_oof_only
  nested_variant_reported: true

admission:
  not_worse_than_eq_quarters_on: [accuracy, cohen_kappa, auprc, mcc, macro_f1, brier]
  direction: higher_is_better_except_brier
  evaluated_on: train_oof_only
  out_of_sample_survival_is_reported_not_assumed: true

weight_search:
  grid_step: 0.01
  objective: minimise_abs_sensitivity_minus_specificity_subject_to_admission
  tie_break: highest_mcc

recalibration:
  method: platt_logistic_on_logit
  fitted_on: 324_row_d1_train_cross_fitted_oof_only
  monotone: true
  note: >-
    A monotone recalibration leaves AUPRC and AUROC mathematically unchanged and
    moves the 0.5 decision. Thresholding the recalibrated score at 0.5 equals
    thresholding the raw score at the cut the training data implies -- an
    operating point chosen from training data, reported as such rather than
    presented as balance obtained for free.

sealed_inputs:
  quad_train_oof:
    path: outputs/quad_blend_20260822/cv5_train_oof_predictions.csv
    sha256: 15e0b69cda172d2d9167d901d21a0669d418e41862cb82fcc289ad76adee4b84
  quad_d1_test:
    path: outputs/quad_blend_20260822/predictions_d1_test.csv
    sha256: 07b9eeb9d20b3a3f5381fe8f8bcce191a77a2a830835c6718f1d4b8dfb4542e0
  quad_drugage:
    path: outputs/quad_blend_20260822/predictions_drugage.csv
    sha256: b0da780cd3ae12fa66ef9b2a6223cd36c79d2e183e6540f7a64665887da1dbec
  quad_agextend:
    path: outputs/quad_blend_20260822/predictions_agextend.csv
    sha256: 746c276d6342a807ffa24a20be93b0462f935bbfd2e12300003af879e765fff5

immutability:
  existing_run_directories_are_read_only: true
  new_run_directory_must_not_exist: true
