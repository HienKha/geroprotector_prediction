schema_version: geroprotector.hypermoltab_paper405.protocol.v1
scientific_role: exact_raw_row_paper_holdout_contextual_deep_benchmark
headline_eligible: false

source_paper:
  doi: 10.1186/s13321-025-01058-5
  repository_commit: c8f458925f5ea2beeba87c7c2dda62eefacf618c

sources:
  positive_sha256: 41cc8451d80b9aec09574842e4c7007132d68cd613436460b2a784154f609e74
  negative_sha256: 396f78e7546d76529c808abb01d02da617da92c3d4aed83551901cc3ffd09c14
  expected_rows: 405
  expected_positive: 206
  expected_negative: 199

paper_split:
  train_size: 0.8
  random_state: 42
  stratify: false
  expected_assignment_sha256: 0eb31569408c3db463a097b016a1972ef83ce552edcfc7a41297bed4248ccdf8
  expected_train_rows: 324
  expected_test_rows: 81

selection_split:
  validation_fraction_of_paper_train: 0.2
  random_state: 42
  stratify: true
  selection_metric: auprc_average_precision_positive
  threshold_metric: mcc

features:
  paper_descriptors:
    - Total Molweight
    - cLogP
    - H-Acceptors
    - H-Donors
    - Total Surface Area
    - Relative PSA
    - Rotatable Bonds
  morgan_radius: 2
  morgan_bits: 2048
  morgan_use_chirality: false
  preprocessing: standard_scaler_fit_on_active_training_only

teachers:
  cross_fitted_training_predictions: true
  folds: 5
  random_state: 42
  extra_trees:
    n_estimators: 500
    max_features: sqrt
    min_samples_leaf: 1
    class_weight: balanced
    n_jobs: 1
  xgboost:
    n_estimators: 400
    max_depth: 3
    learning_rate: 0.04
    subsample: 0.85
    colsample_bytree: 0.85
    objective: binary:logistic
    eval_metric: logloss
    n_jobs: 1

training:
  required_torch_version: 2.6.0
  seed: 42
  device: auto
  hidden_dim: 128
  dropout: 0.20
  tabm_k: 16
  learning_rate: 0.0004
  weight_decay: 0.0003
  batch_size: 64
  epochs: 180
  patience: 25
  pretrain_epochs: 25
  loss: focal
  focal_alpha: 1.0
  focal_gamma: 1.0
  rank_weight: 0.10
  distill_weight: 0.15

variants:
  - hyper_moltab
  - hyper_moltab_no_graph
  - hyper_moltab_no_tabm
  - hyper_moltab_no_kan
  - hyper_moltab_no_tree
  - hyper_moltab_no_cl
  - hyper_moltab_no_graph_no_cl
  - hyper_moltab_distill_rank

evaluation:
  auprc_definition: sklearn_average_precision
  metrics_include: [auprc, auroc, mcc, macro_f1, accuracy, balanced_accuracy, brier]
  outer_test_used_for_epoch_selection: false
  outer_test_used_for_threshold_selection: false
  outer_test_used_for_variant_selection: false
  hagr_loaded: false
