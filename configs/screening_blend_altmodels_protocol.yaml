  external_completed:
    path: outputs/screeningblend_external_20260817/COMPLETED.json
    sha256: e25c04e075a25f73091dc34e48441e72f107e9c45e8aad7e30b5e530cf59a6a8
  drugage_scored:
    path: outputs/screeningblend_external_20260817/drugage/scored/scored_predictions.csv
    sha256: 09aadd7b8ae08e8282599d07f23bc735112009b15a3beab92ab4320602ee1ece
  agextend_scored:
    path: outputs/screeningblend_external_20260817/agextend/scored/scored_predictions.csv
    sha256: e5f0431af76839beaca7ffa09adb383b5181e12047ba9574d6dda4a5616fc90e
  ablation_completed:
    path: outputs/screeningblend_ablation_papersvm_20260818/COMPLETED.json
    sha256: dc264cd26dd3a61dc84045a6e3272c4d14ce6a044c58f4b72ebaa6fb4cebcee8
  ablation_d1_metrics:
    path: outputs/screeningblend_ablation_papersvm_20260818/d1_component_metrics.csv
    sha256: b027b9f9e97db6197beb6cf93f36d195935e43a4129dbe54943719de9e86dbff
  ablation_external_metrics:
    path: outputs/screeningblend_ablation_papersvm_20260818/external_component_metrics.csv
    sha256: 92fb7942f8a495c9435a3dace6aafbc0540e80706442b9cca21deb909902174e
  ablation_thresholds:
    path: outputs/screeningblend_ablation_papersvm_20260818/component_thresholds.csv
    sha256: 0ff30446006f247a013b12c7da0275cd5c17a000b8dae9f87bccb476e4ef5917

parity_contract:
  rebuilt_paper_svm_and_tanimoto_streams_must_match_sealed_run: true
  parity_atol: 1.0e-12
  rebuilt_rdkit2d_context_must_equal_sealed_tabpfn_context: true
  rebuilt_morgan_bits_must_equal_sealed_tanimoto_train_bits: true

endpoints:
  d1_paper_test: held_out_81_row_paper_split
  drugage: significant_positive_retrieval_background_not_certified_negative
  agextend: published_independent_table6_binary
  drugage_background_is_certified_negative: false
  agextend_negative_class_too_small_for_formal_inference: true

applicability:
  similarity: morgan_radius2_2048bit_tanimoto_to_locked_d1_train
  threshold: 0.40
  outside_rule: maximum_tanimoto_lt_0p40
  use_as_exclusion_filter: false

immutability:
  existing_run_directories_are_read_only: true
  new_run_directory_must_not_exist: true
