schema_version: geroprotector.weighted_blend_tabfm.protocol.v1
scientific_role: >-
  train_oof_weight_search_over_svm_tanimoto_tabfm_using_the_identical_171_candidate
  grid_and_selection_rule_that_produced_the_locked_010_060_030_tabpfn_blend

search_contract:
  weights_selected_on_train_oof_only: true
  reuses_the_sealed_171_candidate_grid: true
  no_component_is_refitted: true
  test_or_external_labels_used_for_weight_or_threshold: false
  primary_metric: auprc_average_precision_positive
  tie_break: [auprc_practical_tie_0.005, mcc, macro_f1, brier, distance_from_equal, candidate_id]
  threshold_rule: maximize_mcc_on_324_train_oof
  note: >-
    Slot 3 is TabFM. The sealed grid helper names that slot "tabpfn" internally;
    the manifest records the mapping explicitly so nothing is ambiguous.

reference:
  # From outputs/screeningblend_tabfm_20260821/RUN_MANIFEST.json, used only to
  # score the already-existing equal-thirds TabFM blend side by side.
  equal_thirds_tabfm_oof_threshold: 0.5263794471128225

paper_split:
  expected_assignment_sha256: 0eb31569408c3db463a097b016a1972ef83ce552edcfc7a41297bed4248ccdf8
  expected_train_rows: 324
  expected_test_rows: 81

