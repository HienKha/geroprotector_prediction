schema_version: geroprotector.blend_xai_v5.protocol.v1
scientific_role: model_specific_explainability_shap_global_lime_permutation_decision_curves
contract:
  any_model_is_refitted: false
  test_labels_used_to_build_explanations: false
  fixed_threshold: 0.5
  attribution_scope: per component in its native feature space, carried to the blend
    with weight 1/3; components do not share a feature space
shap:
  svm: analytic_linear_exact
  foundation_models: kernel_shap
  background_clusters: 32
  caveat: KernelSHAP perturbs molecular descriptors independently; the resulting synthetic
    points need not correspond to realisable molecules, a known limitation of perturbation
    attribution on QSAR descriptors
lime:
  scope: local_ridge_surrogate_aggregated_globally
  kernel_width: 0.75
  reference: post hoc LIME as used by the T-DDI reference implementation, extended
    from local to global
permutation:
  repeats: 3
  statistic: mean_abs_probability_shift
decision_curve:
  statistic: net_benefit
  reference_policies:
  - treat_all
  - treat_none
tabfm:
  repository: https://github.com/google-research/tabfm
  repository_commit: fbb665569425fd2f490c6576b3af967876fe11ff
  vendored_path: third_party/tabfm
  required_package_version: 1.0.1
  backend: pytorch
  device: cuda
  huggingface_repo: google/tabfm-1.0.0-pytorch
  weights_license: tabfm-non-commercial-v1.0
  hyperparameters:
    n_estimators: 4
    softmax_temperature: 0.9
    max_num_features: 500
    max_num_rows: null
tabpfn_v2:
  required_package_version: 8.0.8
  explicit_model_version: V2
