[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "geroprotector-prediction"
version = "1.0.0"
description = "Leakage-audited chemical-structure geroprotector benchmarking workflows"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "joblib==1.5.2",
  "jsonschema==4.25.1",
  "numpy==2.0.2",
  "pandas==2.3.2",
  "pyarrow==21.0.0",
  "PyYAML==6.0.2",
  "rdkit==2025.3.6",
  "scikit-learn==1.7.1",
  "scipy==1.16.1",
  "xgboost==3.3.0",
]

[project.optional-dependencies]
hypermoltab = [
  "torch==2.6.0",
]
traditional = [
  "catboost==1.2.10",
  "lightgbm==4.6.0",
]
v6 = [
  "torch==2.6.0",
  "tabpfn==8.1.0",
  "tabicl==2.1.1",
]
test = [
  "pytest==8.4.1",
  "ruff==0.12.8",
]

[project.scripts]
gero = "geroprotector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geroprotector"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
